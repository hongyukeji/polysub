# Public evaluation set for scripts/bench (Q0 of docs/plans/builtin-engine.md).
#
# Only material whose license explicitly allows redistribution (CC0, CC BY,
# CC BY-SA, public domain) from trusted sites. Videos are downloaded by
# `bench.py fetch` into the per-user cache directory (never into the repo) and
# checked against sha256. `clip` is the part that is evaluated, in seconds
# (end = 0 means to the end of the file); a clip other than the whole file is
# cut with ffmpeg into the cache.
#
# `reference` is an optional existing subtitle used only for the side-by-side
# table. It is downloaded at run time, not stored in the repo, because its own
# license is not stated.
#
# data/<id>/ holds what may be redistributed under the video's license: the
# frozen recognition result of the baseline run (asr.json, so translation-only
# runs are reproducible without the video or an ASR server) and the drafted
# annotation of the baseline translation.

