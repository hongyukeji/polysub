[project]
name = "polysub"
version = "0.3.0"
description = "Local video -> subtitles in any language (VAD + OpenAI-compatible ASR and LLM translation)"
readme = "README.md"
license = "MIT"
authors = [{ name = "鸿宇", email = "hongyusvip@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "av>=14",               # audio decoding (bundled FFmpeg libraries)
  "onnxruntime>=1.18",    # Silero VAD
  "numpy>=1.26",
  "requests>=2.31",
  "pysubs2>=1.7",         # SRT / ASS / VTT
  "opencc-python-reimplemented>=0.1.7",
  "tomlkit>=0.12",
  "platformdirs>=4",
  "filelock>=3.12",
]

[project.urls]
Homepage = "https://github.com/hongyukeji/polysub"
Issues = "https://github.com/hongyukeji/polysub/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
polysub = "polysub.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polysub = ["assets/*"]
