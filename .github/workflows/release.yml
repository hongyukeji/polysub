# Push a tag like v1.2.3 -> test, build and sign the macOS app -> draft GitHub Release
# with PolySub-<version>-macos-arm64.zip and SHA256SUMS, using docs/releases/<version>.md as notes.
# Publish the draft after checking the downloaded package (see docs/releases/README.md);
# hongyukeji/homebrew-tap then picks the release up automatically (no secrets needed).
# To reuse for another tool: change APP_NAME, keep packaging/macos/build.sh.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  APP_NAME: PolySub          # the .app built by packaging/macos/build.sh into build/dist/

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check version and release notes
        run: |
          VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }
          test -s "docs/releases/$VERSION.md" || { echo "missing docs/releases/$VERSION.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          uv sync --frozen --extra gui
          uv run --frozen python -m unittest discover -s tests

      - name: Build and sign
        run: packaging/macos/build.sh

      - name: Package
        run: |
          ZIP="$APP_NAME-$VERSION-macos-arm64.zip"
          mkdir -p out/pkg
          ditto "build/dist/$APP_NAME.app" "out/pkg/$APP_NAME.app"
          cp LICENSE THIRD_PARTY_NOTICES.md out/pkg/
          (cd out/pkg && ditto -c -k --sequesterRsrc . "../$ZIP")
          (cd out && shasum -a 256 "$ZIP" > SHA256SUMS && cat SHA256SUMS)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip out/SHA256SUMS --verify-tag --draft \
            --title "$APP_NAME $VERSION" --notes-file "docs/releases/$VERSION.md"
